<!-- @dsCard group="Brand" name="Portrait treatment" subtitle="Circular, ink border, 2° tilt, yellow hard shadow" width="480" height="340" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',-apple-system,sans-serif; padding:2rem; background:#FFF9EE; color:#26221B; text-align:center; }
  .portrait {
    width:150px; height:150px; border-radius:50%; margin:0 auto;
    border:4px solid #26221B; transform:rotate(2deg); box-shadow:6px 6px 0 #FFD84D;
    background:repeating-linear-gradient(45deg,#F4EDDE,#F4EDDE 12px,#EFE6D2 12px,#EFE6D2 24px);
    display:flex; align-items:center; justify-content:center; font-size:0.65rem; letter-spacing:0.12em; text-transform:uppercase; color:#5C5648;
  }
  .note { margin-top:1.5rem; font-size:0.78rem; color:#5C5648; line-height:1.55; }
</style>
</head>
<body>
  <div class="portrait">photo</div>
  <p class="note">Circular crop, object-position center top, 4px ink border,<br>2° rotation, 6×6 yellow hard shadow. Use images/profile.webp on the real site.</p>
</body>
</html>
