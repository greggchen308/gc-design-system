<!-- @dsCard group="Components" name="Buttons" subtitle="Primary (yellow fill) / secondary (outline), hover lift" width="800" height="300" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',-apple-system,sans-serif; padding:2rem; background:#FFF9EE; color:#26221B; }
  .row { display:flex; gap:1rem; flex-wrap:wrap; align-items:center; }
  .btn {
    display:inline-block; font-weight:700; font-size:0.95rem; text-decoration:none; color:#26221B;
    border:3px solid #26221B; border-radius:999px; padding:0.7rem 1.6rem;
    transition:transform 0.15s ease, box-shadow 0.15s ease; cursor:pointer; background:transparent;
  }
  .btn.primary { background:#FFD84D; }
  .btn:hover { transform:translateY(-2px); box-shadow:4px 5px 0 rgba(38,34,27,0.16); }
  .note { margin-top:1.4rem; font-size:0.78rem; color:#5C5648; line-height:1.55; max-width:52ch; }
</style>
</head>
<body>
  <div class="row">
    <a class="btn primary" href="#">See what I build</a>
    <a class="btn" href="#">Work with me</a>
  </div>
  <p class="note">Primary = yellow fill + ink text. Secondary = transparent + ink text. Border always 3px ink, radius 999px. Hover: −2px lift + hard shadow. No gradients, ever. Yellow never carries text without ink.</p>
</body>
</html>
